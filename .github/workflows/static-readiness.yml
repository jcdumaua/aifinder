name: Static readiness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:phase-compiler
      - run: npm run test:static-safety-manifest
      - run: npm run test:readiness-coverage
      - run: npm run test:public-launch-blockers
      - run: npm run test:public-production-runtime-planning
      - run: npm run test:static-readiness-workflow
      - run: npm run test:accessibility-responsive-static

  lint:
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint -- --quiet

  typecheck:
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck

  static-readiness:
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:static-readiness-core
